<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion's Healer | Master Inventory Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #faf9f6;">

    <!-- Secure Password Access Modal Intercept Layer -->
    <div id="admin-auth-lockout-modal" class="cart-drawer-overlay" style="background-color: #ffffff; justify-content: center; align-items: center; width: 100%; height: 100%;">
        <div class="auth-box" style="max-width: 400px; width: 90%;">
            <h2 style="font-size: 1.4rem; font-weight: bold; margin-bottom: 10px;">Admin Authentication Gate</h2>
            <p class="auth-subtitle">Enter your private sanctuary key code to unlock settings</p>
            <input type="password" id="admin-secret-pass-key" placeholder="Enter Admin Password" class="auth-input" style="text-align: center;">
            <button onclick="verifyAdminGatewayPasskey()" class="auth-submit-btn">Unlock Dashboard</button>
            <p id="admin-auth-error-msg" style="color: red; font-size: 0.85rem; margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- Protected Real Dashboard View Container (Hidden behind modal layer) -->
    <div id="master-admin-dashboard-view" class="hidden">
        <header class="site-header">
            <div class="logo" style="font-weight: bold; font-size: 1.4rem;">ORION'S ADMIN PANEL</div>
            <nav class="main-nav">
                <a href="index.html" style="text-decoration: underline; color: #2b70c9;">View Live Store</a>
            </nav>
        </header>

        <main class="store-container" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
            <h1 style="text-align: center; margin-bottom: 30px; font-size: 2rem;">Inventory Management Panel</h1>

            <!-- Inventory Table List -->
            <section class="auth-box" style="text-align: left; background: white; padding: 25px; border: 1px solid #eee;">
                <h3 style="margin-bottom: 15px; font-size: 1.2rem;">Current Live Stock</h3>
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; font-size: 0.95rem;">
                        <thead>
                            <tr style="background-color: #f5f5f5; border-bottom: 2px solid #ddd;">
                                <th style="padding: 12px; text-align: left;">Product Details</th>
                                <th style="padding: 12px; text-align: left;">Retail Price</th>
                                <th style="padding: 12px; text-align: center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-table-body">
                            <!-- Injected dynamically via script -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
